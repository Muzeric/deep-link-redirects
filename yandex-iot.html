<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Открыть «Дом с Алисой»</title>
  <link rel="canonical" href="https://muzeric.github.io/deep-link-redirects/yandex-iot.html">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font: 18px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #ffcc00;
      color: #000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 1.5rem;
      -webkit-tap-highlight-color: rgba(0,0,0,.08);
    }
    a.app-tap {
      display: block;
      width: 100%;
      max-width: 420px;
      padding: 2.4rem 1.5rem;
      border-radius: 24px;
      background: rgba(0,0,0,.05);
      color: inherit;
      text-decoration: none;
      font-weight: 600;
      font-size: 1.6rem;
      line-height: 1.2;
    }
    .hint  { margin-top: 2rem; font-size: 0.9rem; opacity: .65; max-width: 380px; }
    .small { margin-top: 0.6rem; font-size: 0.78rem; opacity: .5; }
    .small a { color: inherit; }
  </style>
</head>
<body>

  <a class="app-tap" href="yandexiot://">
    📷 Открыть<br>«Дом с Алисой»
  </a>

  <p class="hint">Тапни в любое место экрана — Safari спросит подтверждение и откроет приложение.</p>

  <p class="small">
    Не установлено? <a href="https://apps.apple.com/app/id1582810683">App Store</a> ·
    Android <a href="https://play.google.com/store/apps/details?id=com.yandex.iot">Google Play</a>
  </p>

  <script>
    // Любой тап в body запускает приложение (если не было прямого тапа в кнопку).
    // Это user gesture, iOS Safari разрешает custom-схему.
    document.body.addEventListener('click', function (e) {
      // Не дублируем если кликнули в App Store / Play или в основную кнопку
      if (e.target.closest('a')) return;
      window.location.href = 'yandexiot://';
    });
  </script>
</body>
</html>
